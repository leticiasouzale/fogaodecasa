<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Aprovação Fogão de Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: faixa verde com logo no topo, título à esquerda, grade de cartões 1 a 2 colunas.
   Cada cartão: mídia, caixa suspensa de avaliação logo abaixo, campo de alterações sob demanda. */
:root{
  --bg:#FFF6E9; --surface:#FFFDF8; --ink:#27311F; --muted:#6A6650; --line:#EADBC1; --media:#F3E7D1;
  --orange:#E85D2A; --orange-ink:#A33B12; --orange-tint:#FBE2D4;
  --saffron:#F7B32B; --saffron-ink:#7A5200; --saffron-tint:#FDEFC8;
  --green:#4C8C3B; --green-ink:#2F5A24; --green-tint:#E2EFDA;
  --head:#4C8C3B; --btn:#34622A; --btn-ink:#FFF6E9; --focus:#E85D2A;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171D13; --surface:#212A1B; --ink:#F7EBD7; --muted:#B9B39B; --line:#36422D; --media:#10150D;
    --orange-ink:#FFAB85; --orange-tint:#46261A; --saffron-ink:#F9C95C; --saffron-tint:#40320F;
    --green-ink:#A9D69A; --green-tint:#22361B; --head:#2F5526; --btn:#8CC57A; --btn-ink:#13200E; --focus:#F7B32B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171D13; --surface:#212A1B; --ink:#F7EBD7; --muted:#B9B39B; --line:#36422D; --media:#10150D;
  --orange-ink:#FFAB85; --orange-tint:#46261A; --saffron-ink:#F9C95C; --saffron-tint:#40320F;
  --green-ink:#A9D69A; --green-tint:#22361B; --head:#2F5526; --btn:#8CC57A; --btn-ink:#13200E; --focus:#F7B32B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

/* Cabeçalho */
.head{background:var(--head);color:#FFF6E9}
.head .wrap{padding-block:28px 26px;display:flex;flex-direction:column;gap:14px}
.eyebrow{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#FDE7B8}
.logo{display:block;width:min(100%,340px);height:auto}
.stripe{height:6px;background:linear-gradient(90deg,#E85D2A 0 50%,#F7B32B 50% 100%)}

/* Introdução */
.intro{padding-block:36px 8px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font:600 clamp(2rem,6.5vw,3.1rem)/1.08 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.lede{margin:0;max-width:60ch;color:var(--muted)}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip::before,.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-pendente{background:var(--saffron-tint);color:var(--saffron-ink)}
.s-aprovado{background:var(--green-tint);color:var(--green-ink)}
.s-alteracao{background:var(--orange-tint);color:var(--orange-ink)}

/* Painel da agência */
.admin{margin-top:22px;padding:18px;border:1.5px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.admin h2{margin:0;font:600 1.15rem/1.2 var(--font-display)}
.admin .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 240px;min-width:0}
.body .field{flex:none}
label,.lbl{font-size:.88rem;font-weight:700}
input[type=text],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px}
textarea{resize:vertical;min-height:104px}
input[type=text]:hover,select:hover,textarea:hover{border-color:var(--green)}
.btn{font:700 .95rem/1 var(--font-body);border:0;border-radius:10px;padding:13px 18px;cursor:pointer;background:var(--btn);color:var(--btn-ink);min-height:46px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.alt:hover{border-color:var(--orange)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.08)}
.hint{margin:0;font-size:.82rem;color:var(--muted)}
.status{min-height:1.4em;margin:0;font-size:.88rem;font-weight:600;color:var(--green-ink)}
.status.err{color:var(--orange-ink)}

/* Cartões */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:22px;padding-block:26px 56px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.media{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--media)}
.media video,.media .slide img{width:100%;height:100%;object-fit:contain;display:block}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;height:100%}
.nav{position:absolute;top:50%;translate:0 -50%;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;background:rgba(39,49,31,.72);color:#FFF6E9;font-size:1.4rem;line-height:1}
.nav.prev{left:10px}.nav.next{right:10px}
.count{position:absolute;right:10px;bottom:10px;padding:3px 10px;border-radius:999px;background:rgba(39,49,31,.78);color:#FFF6E9;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.missing{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:var(--muted);font-size:.9rem}
.body{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center}
.kind{font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:.8rem;font-weight:700}
.ctitle{margin:0;font:600 1.3rem/1.2 var(--font-display);overflow-wrap:anywhere}
.cap{display:flex;flex-direction:column;gap:6px}
.cap p{margin:0;white-space:pre-line;overflow-wrap:anywhere;font-size:.95rem;line-height:1.6}
.form{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;padding-right:42px;cursor:pointer;font-weight:600}
.sel::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);translate:0 -70%;rotate:45deg;pointer-events:none}
.meta{margin:0;font-size:.84rem;color:var(--muted)}
.danger{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px;border-top:1px dashed var(--line)}
.link{background:none;border:0;padding:6px 0;font:600 .84rem var(--font-body);color:var(--muted);text-decoration:underline;cursor:pointer}
.link.red{color:var(--orange-ink)}

.notice{padding:22px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);background:var(--surface)}
.notice strong{display:block;color:var(--ink);font:600 1.15rem var(--font-display);margin-bottom:4px}
.foot{padding-block:0 40px;color:var(--muted);font-size:.82rem}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}}
</style>

<script>
(function(){
  var ENDPOINT='https://script.google.com/macros/s/AKfycbyIdhU91ZwSh23DdioQJHVOJtAcc-ypogJzoHczX83WXbO3FMLhJRuDUxMHTKW2uLe-cA/exec';
  var items=[], cards=new Map();
  var grid=document.getElementById('grid'), stateEl=document.getElementById('state'), tally=document.getElementById('tally');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fmt=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  var LABEL={pendente:'Aguardando resposta',aprovado:'Aprovado',alteracao:'Alteração solicitada'};

  function h(tag,props){
    var e=document.createElement(tag); props=props||{};
    Object.keys(props).forEach(function(k){
      var v=props[k];
      if(k==='class')e.className=v;
      else if(k==='text')e.textContent=v;
      else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
      else if(v===true)e.setAttribute(k,'');
      else if(v!==false&&v!=null)e.setAttribute(k,v);
    });
    for(var i=2;i<arguments.length;i++){var c=arguments[i]; if(c==null)continue; if(Array.isArray(c))c.forEach(function(x){e.append(x)}); else e.append(c);}
    return e;
  }
  function showState(title,text){stateEl.hidden=false;stateEl.replaceChildren(h('strong',{text:title}),document.createTextNode(text||''))}

  /* Respostas ficam salvas no navegador de quem respondeu */
  function load(id){try{return JSON.parse(localStorage.getItem('fdc-resp-'+id)||'null')||{}}catch(e){return {}}}
  function save(id,v){try{localStorage.setItem('fdc-resp-'+id,JSON.stringify(v))}catch(e){}}

  function buildMedia(data){
    var files=data.files||[];
    var box=h('div',{class:'media'});
    if(!files.length){box.append(h('div',{class:'missing',text:'Arquivo indisponível.'}));return box;}
    if(data.kind==='video'){
      var v=h('video',{controls:true,playsinline:true,preload:'metadata',src:files[0],'aria-label':data.title||'Vídeo do conteúdo'});
      v.addEventListener('error',function(){box.replaceChildren(h('div',{class:'missing',text:'Não foi possível carregar o vídeo.'}))});
      box.append(v);return box;
    }
    var n=files.length;
    var track=h('div',{class:'track',tabindex:'0',role:'group','aria-label':'Fotos do conteúdo'});
    files.forEach(function(f,i){
      var img=h('img',{src:f,alt:(data.title?data.title+' · ':'')+'foto '+(i+1)+' de '+n,loading:'lazy'});
      var slide=h('div',{class:'slide'},img);
      img.addEventListener('error',function(){slide.replaceChildren(h('div',{class:'missing',text:'Não foi possível carregar a foto.'}))});
      track.append(slide);
    });
    box.append(track);
    if(n>1){
      var count=h('span',{class:'count',text:'1 / '+n});
      var go=function(d){track.scrollBy({left:d*track.clientWidth,behavior:reduce?'auto':'smooth'})};
      track.addEventListener('scroll',function(){count.textContent=(Math.round(track.scrollLeft/track.clientWidth)+1)+' / '+n});
      box.append(
        h('button',{class:'nav prev',type:'button','aria-label':'Foto anterior',text:'‹',onclick:function(){go(-1)}}),
        h('button',{class:'nav next',type:'button','aria-label':'Próxima foto',text:'›',onclick:function(){go(1)}}),
        count);
    }
    return box;
  }

  function buildCard(data){
    var id=data.id, c={id:id,data:data,resp:load(id),busy:false};
    var n=(data.files||[]).length;
    c.pill=h('span',{class:'pill'});
    c.sel=h('select',{id:'sel-'+id},
      h('option',{value:'',text:'Selecione uma opção'}),
      h('option',{value:'aprovado',text:'Aprovado'}),
      h('option',{value:'alteracao',text:'Alteração'}));
    c.note=h('textarea',{id:'note-'+id,rows:'4',maxlength:'1500',placeholder:'Ex.: trocar a legenda, cortar o início do vídeo, usar outra foto…'});
    c.noteWrap=h('div',{class:'field',hidden:true},h('label',{for:'note-'+id,text:'Descreva as alterações que deseja'}),c.note);
    c.hint=h('p',{class:'hint',hidden:true,text:'Descreva o que precisa mudar para poder enviar.'});
    c.btn=h('button',{class:'btn',type:'button',text:'Enviar resposta',disabled:true});
    c.msg=h('p',{class:'status',role:'status'});
    c.meta=h('p',{class:'meta'});
    c.capP=h('p');
    c.cap=h('div',{class:'cap',hidden:true},h('span',{class:'kind',text:'Legenda'}),c.capP);

    var sync=function(){
      var v=c.sel.value, filled=c.note.value.trim().length>0;
      c.noteWrap.hidden=v!=='alteracao';
      c.hint.hidden=!(v==='alteracao'&&!filled);
      c.btn.disabled=c.busy||!(v==='aprovado'||(v==='alteracao'&&filled));
    };
    var touch=function(){c.msg.textContent='';c.msg.className='status';sync()};
    c.sel.addEventListener('change',touch);
    c.note.addEventListener('input',touch);

    c.btn.addEventListener('click',function(){
      var v=c.sel.value, note=c.note.value.trim();
      if(!(v==='aprovado'||(v==='alteracao'&&note)))return;
      if(!ENDPOINT||ENDPOINT.indexOf('COLE_AQUI')===0){c.msg.className='status err';c.msg.textContent='O envio de respostas ainda não foi configurado.';return}
      c.busy=true;sync();c.btn.textContent='Enviando…';
      var titulo=data.title||id;
      fetch(ENDPOINT,{
        method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({
          conteudo:titulo,
          resposta:v==='aprovado'?'Aprovado':'Alteração solicitada',
          alteracoes:v==='alteracao'?note:''
        })
      })
      .then(function(r){return r.json()}).then(function(j){
        if(!j.success)throw new Error('fail');
        c.resp={status:v,note:v==='alteracao'?note:'',answeredAt:Date.now()};
        save(id,c.resp);
        c.msg.className='status';c.msg.textContent='Resposta enviada. Obrigado!';
        refresh(c);renderTally();
      }).catch(function(){
        c.msg.className='status err';c.msg.textContent='Não foi possível enviar. Verifique sua conexão e tente de novo.';
      }).then(function(){c.busy=false;c.btn.textContent=c.resp.status?'Atualizar resposta':'Enviar resposta';sync()});
    });

    var body=h('div',{class:'body'},
      h('div',{class:'top'},h('span',{class:'kind',text:data.kind==='video'?'Vídeo':(n>1?'Fotos · '+n:'Foto')}),c.pill),
      data.title?h('h2',{class:'ctitle',text:data.title}):null,
      c.cap,
      h('div',{class:'form'},
        h('div',{class:'field'},h('label',{for:'sel-'+id,text:'Sua avaliação'}),h('div',{class:'sel'},c.sel)),
        c.noteWrap,c.hint,c.btn,c.msg,c.meta));
    c.sync=sync;
    c.el=h('article',{class:'card'},buildMedia(data),body);
    c.capP.textContent=data.caption||'';c.cap.hidden=!data.caption;
    c.sel.value=c.resp.status||'';c.note.value=c.resp.note||'';
    refresh(c);
    return c;
  }
  function refresh(c){
    var st=LABEL[c.resp.status]?c.resp.status:'pendente';
    c.pill.className='pill s-'+st;c.pill.textContent=LABEL[st];
    c.btn.textContent=st==='pendente'?'Enviar resposta':'Atualizar resposta';
    c.meta.textContent=c.resp.answeredAt?'Última resposta em '+fmt.format(new Date(c.resp.answeredAt)).replace(',',' às'):'';
    c.sync();
  }
  function renderTally(){
    var k={pendente:0,aprovado:0,alteracao:0};
    cards.forEach(function(c){k[LABEL[c.resp.status]?c.resp.status:'pendente']++});
    tally.replaceChildren(
      h('span',{class:'chip s-aprovado',text:k.aprovado+(k.aprovado===1?' aprovado':' aprovados')}),
      h('span',{class:'chip s-alteracao',text:k.alteracao+(k.alteracao===1?' com alteração':' com alterações')}),
      h('span',{class:'chip s-pendente',text:k.pendente+' aguardando'}));
  }

  fetch('conteudos.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(list){
    items=list||[];
    if(!items.length){showState('Nenhum conteúdo por aqui ainda.',' Os conteúdos da semana aparecem aqui assim que forem anexados.');return}
    stateEl.hidden=true;
    items.forEach(function(d){var c=buildCard(d);cards.set(d.id,c);grid.append(c.el)});
    renderTally();
  }).catch(function(){showState('Não foi possível carregar os conteúdos.',' Recarregue a página em instantes.')});
})();
</script>

</body></html>
